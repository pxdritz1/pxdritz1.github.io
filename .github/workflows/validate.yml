name: validate site build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: build and generate SEO pages
        run: npm run build
      - name: verify Angular output and SEO pages
        run: |
          output=dist/pxdritz-portfolio/browser
          test -s "$output/index.html"
          test -s "$output/projects/index.html"
          test -s "$output/gallery/index.html"
          test -s "$output/about/index.html"
          test -s "$output/contact/index.html"
          test -s "$output/sitemap.xml"
          test -s "$output/assets/sf-pro.woff"
          grep -q 'name="description"' "$output/index.html"
          grep -q 'application/ld+json' "$output/index.html"
          grep -q "BrainShake" "$output/projects/index.html"
          grep -q "Cujos" "$output/gallery/index.html"
